apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-webapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-webapp

  template:
    metadata:
      labels:
        app: java-webapp

    spec:
      containers:
        - name: java-webapp
          image: jishnudev9895/java-webapp:IMAGE_TAG
          ports:
            - containerPort: 8080